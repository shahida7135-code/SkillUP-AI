services:

  # =========================================================
  # PART 1 - BACKEND
  # =========================================================
  part1-backend:
    build:
      context: ./Part-1/backend
      dockerfile: Dockerfile
    container_name: skillup-part1-backend
    ports:
      - "8000:8000"
    restart: unless-stopped


  # =========================================================
  # PART 1 - FRONTEND
  # MAIN APPLICATION
  # =========================================================
  part1-frontend:
    build:
      context: ./Part-1/frontend
      dockerfile: Dockerfile
    container_name: skillup-part1-frontend
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      - part1-backend
    restart: unless-stopped


  # =========================================================
  # PART 2 - BACKEND
  # =========================================================
  part2-backend:
    build:
      context: ./Part-2/backend
      dockerfile: Dockerfile
    container_name: skillup-part2-backend
    ports:
      - "8001:8001"
    restart: unless-stopped


  # =========================================================
  # PART 2 - FRONTEND
  # =========================================================
  part2-frontend:
    build:
      context: ./Part-2/frontend
      dockerfile: Dockerfile
    container_name: skillup-part2-frontend
    ports:
      - "5174:5174"
    command: npm run dev -- --host 0.0.0.0 --port 5174
    depends_on:
      - part2-backend
    restart: unless-stopped


  # =========================================================
  # PART 3 - BACKEND
  # =========================================================
  part3-backend:
    build:
      context: ./Part-3/PART3/Backend
      dockerfile: Dockerfile
    container_name: skillup-part3-backend
    ports:
      - "8002:8002"
    restart: unless-stopped


  # =========================================================
  # PART 3 - FRONTEND
  # =========================================================
  part3-frontend:
    build:
      context: ./Part-3/PART3/Frontend
      dockerfile: Dockerfile
    container_name: skillup-part3-frontend
    ports:
      - "5175:5175"
    command: npm run dev -- --host 0.0.0.0 --port 5175
    depends_on:
      - part3-backend
    restart: unless-stopped


  # =========================================================
  # PART 4 - FLASK BACKEND
  part4-backend:
    build:
      context: ./skillup_part4
      dockerfile: Dockerfile
    container_name: skillup-part4-backend
    ports:
      - "5000:5000"
    env_file:
      - ./skillup_part4/.env
    restart: unless-stopped


  # =========================================================
  # NGINX - SINGLE MAIN URL
  # =========================================================
  nginx:
    image: nginx:alpine
    container_name: skillup-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - part1-frontend
      - part1-backend
      - part2-backend
      - part3-backend
      - part4-backend
    restart: unless-stopped