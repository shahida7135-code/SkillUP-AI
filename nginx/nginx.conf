events {}

http {
    server {
        listen 80;
        server_name localhost;

        # =====================================================
        # MAIN APPLICATION
        # Part 1 React frontend
        # =====================================================
        location / {
            proxy_pass http://part1-frontend:5173;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # =====================================================
        # PART 1 API
        # =====================================================
        location /api/auth/ {
            proxy_pass http://part1-backend:8000/api/auth/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/profile/ {
            proxy_pass http://part1-backend:8000/api/profile/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/health {
            proxy_pass http://part1-backend:8000/api/health;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # =====================================================
        # PART 2 API
        # =====================================================
        location /roadmap/ {
            proxy_pass http://part2-backend:8001/roadmap/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /progress/ {
            proxy_pass http://part2-backend:8001/progress/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /courses/ {
            proxy_pass http://part2-backend:8001/courses/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /quiz/ {
            proxy_pass http://part2-backend:8001/quiz/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # =====================================================
        # PART 3 API
        # =====================================================
        location /api/youtube/ {
            proxy_pass http://part3-backend:8002/api/youtube/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # =====================================================
        # PART 4 FLASK
        # AI ASSISTANT
        # =====================================================
        location /ai {
            proxy_pass http://part4-backend:5000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =====================================================
        # PART 4 FLASK
        # AI INTERVIEW
        # =====================================================
        location /interview {
            proxy_pass http://part4-backend:5000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}